[platformio]
default_envs = heltec_v3

[display]
lib_deps =
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4

[env]
monitor_speed = 115200
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -D NEXSTAR_FIRMWARE_VERSION=\"0.1.0-dev\"
lib_ldf_mode = chain+

[env:heltec_v3]
platform = platformio/espressif32@6.12.0
framework = arduino
board = heltec_wifi_lora_32_V3
build_flags =
    ${env.build_flags}
    -D NEXSTAR_FIRMWARE_PROFILE=1
    -D NEXSTAR_FIRMWARE_PROFILE_NAME=\"bridge\"
    -D NEXSTAR_DISPLAY_ENABLED=1
lib_deps =
    ${display.lib_deps}

[env:heltec_v3_listen_only]
platform = platformio/espressif32@6.12.0
framework = arduino
board = heltec_wifi_lora_32_V3
build_flags =
    ${env.build_flags}
    -D NEXSTAR_FIRMWARE_PROFILE=2
    -D NEXSTAR_FIRMWARE_PROFILE_NAME=\"listen-only\"
    -D NEXSTAR_DISPLAY_ENABLED=1
lib_deps =
    ${display.lib_deps}

[env:heltec_v3_headless]
platform = platformio/espressif32@6.12.0
framework = arduino
board = heltec_wifi_lora_32_V3
build_flags =
    ${env.build_flags}
    -D NEXSTAR_FIRMWARE_PROFILE=1
    -D NEXSTAR_FIRMWARE_PROFILE_NAME=\"bridge-headless\"
    -D NEXSTAR_DISPLAY_ENABLED=0

[env:heltec_v3_display_diag]
platform = platformio/espressif32@6.12.0
framework = arduino
board = heltec_wifi_lora_32_V3
build_flags =
    ${env.build_flags}
    -D NEXSTAR_FIRMWARE_PROFILE=1
    -D NEXSTAR_FIRMWARE_PROFILE_NAME=\"display-diag\"
    -D NEXSTAR_DISPLAY_ENABLED=1
    -D NEXSTAR_DISPLAY_DIAGNOSTICS=1
lib_deps =
    ${display.lib_deps}

[env:native]
platform = native
test_framework = unity
test_build_src = false
build_unflags =
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wpedantic

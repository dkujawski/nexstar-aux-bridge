[platformio]
default_envs = esp32dev_listen_only

[env]
monitor_speed = 115200
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -D NEXSTAR_FIRMWARE_VERSION=\"0.1.0-dev\"
lib_ldf_mode = chain+

[env:esp32dev]
platform = platformio/espressif32@6.12.0
framework = arduino
board = esp32dev
build_flags =
    ${env.build_flags}
    -D NEXSTAR_FIRMWARE_PROFILE=1
    -D NEXSTAR_FIRMWARE_PROFILE_NAME=\"bridge\"
    -D NEXSTAR_BOARD_PROFILE_NAME=\"esp32-devkit-v1\"
    -D NEXSTAR_DISPLAY_ENABLED=0

[env:esp32dev_listen_only]
platform = platformio/espressif32@6.12.0
framework = arduino
board = esp32dev
build_flags =
    ${env.build_flags}
    -D NEXSTAR_FIRMWARE_PROFILE=2
    -D NEXSTAR_FIRMWARE_PROFILE_NAME=\"listen-only\"
    -D NEXSTAR_BOARD_PROFILE_NAME=\"esp32-devkit-v1\"
    -D NEXSTAR_DISPLAY_ENABLED=0
    -D NEXSTAR_AUX_CAPTURE_ENABLED=1

[env:esp32dev_listen_only_tft]
platform = platformio/espressif32@6.12.0
framework = arduino
board = esp32dev
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
build_flags =
    ${env.build_flags}
    -D NEXSTAR_FIRMWARE_PROFILE=2
    -D NEXSTAR_FIRMWARE_PROFILE_NAME=\"listen-only-tft\"
    -D NEXSTAR_BOARD_PROFILE_NAME=\"esp32-devkit-v1\"
    -D NEXSTAR_DISPLAY_ENABLED=1
    -D NEXSTAR_DISPLAY_DIAGNOSTICS=1
    -D NEXSTAR_AUX_CAPTURE_ENABLED=1

[env:esp32dev_headless]
platform = platformio/espressif32@6.12.0
framework = arduino
board = esp32dev
build_flags =
    ${env.build_flags}
    -D NEXSTAR_FIRMWARE_PROFILE=1
    -D NEXSTAR_FIRMWARE_PROFILE_NAME=\"bridge-headless\"
    -D NEXSTAR_BOARD_PROFILE_NAME=\"esp32-devkit-v1\"
    -D NEXSTAR_DISPLAY_ENABLED=0

[env:esp32dev_diagnostic]
platform = platformio/espressif32@6.12.0
framework = arduino
board = esp32dev
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
build_flags =
    ${env.build_flags}
    -D NEXSTAR_FIRMWARE_PROFILE=3
    -D NEXSTAR_FIRMWARE_PROFILE_NAME=\"diagnostic\"
    -D NEXSTAR_BOARD_PROFILE_NAME=\"esp32-devkit-v1\"
    -D NEXSTAR_DISPLAY_ENABLED=1
    -D NEXSTAR_DISPLAY_DIAGNOSTICS=1

[env:native]
platform = native
test_framework = unity
test_build_src = false
build_unflags =
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Wpedantic

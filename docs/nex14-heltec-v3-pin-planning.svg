<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .title{font:700 52px Arial,sans-serif;fill:#10295a}
      .sub{font:700 28px Arial,sans-serif;fill:#10295a}
      .body{font:24px Arial,sans-serif;fill:#172033}
      .small{font:20px Arial,sans-serif;fill:#172033}
      .pin{font:700 22px Consolas,monospace;fill:#172033}
      .call{font:700 24px Arial,sans-serif;fill:#10295a}
      .warn{font:700 25px Arial,sans-serif;fill:#b31b1b}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2457a6"/>
    </marker>
  </defs>

  <rect width="1600" height="1100" fill="#fff"/>
  <rect x="24" y="24" width="1552" height="1052" rx="22" fill="none" stroke="#10295a" stroke-width="4"/>
  <text x="800" y="90" text-anchor="middle" class="title">NEX-14 — HELTEC V3/V3.1 PIN PLANNING</text>
  <text x="800" y="138" text-anchor="middle" class="sub">HTIT-WB32LA(F) • rear/silkscreen view • USB-C at bottom</text>
  <rect x="260" y="168" width="1080" height="54" rx="10" fill="#fff1f1" stroke="#c52121" stroke-width="3"/>
  <text x="800" y="205" text-anchor="middle" class="warn">UNASSEMBLED — DO NOT APPLY AUX POWER OR CONNECT THE MOUNT</text>

  <!-- Simplified deterministic board outline -->
  <rect x="120" y="260" width="600" height="650" rx="34" fill="#f5f6f8" stroke="#5b6472" stroke-width="4"/>
  <text x="420" y="326" text-anchor="middle" class="sub">HELTEC WiFi LoRa 32 V3/V3.1</text>
  <text x="420" y="366" text-anchor="middle" class="body">Rear view matching the photographed board</text>
  <rect x="280" y="430" width="280" height="250" rx="22" fill="#e3e7ed" stroke="#697386" stroke-width="3"/>
  <text x="420" y="540" text-anchor="middle" class="sub">ESP32-S3</text>
  <text x="420" y="578" text-anchor="middle" class="body">board electronics</text>
  <rect x="330" y="850" width="180" height="70" rx="12" fill="#c7ccd4" stroke="#505967" stroke-width="3"/>
  <text x="420" y="895" text-anchor="middle" class="body">USB-C</text>

  <!-- Right-hand header, top-to-bottom exactly as visible in Photo 1 -->
  <text x="600" y="250" class="small">Top of photographed board</text>
  <g>
    <circle cx="680" cy="290" r="13" fill="#ffd56a" stroke="#735917" stroke-width="3"/><text x="635" y="298" class="pin">7</text>
    <circle cx="680" cy="330" r="13" fill="#ffd56a" stroke="#735917" stroke-width="3"/><text x="635" y="338" class="pin">6</text>
    <circle cx="680" cy="370" r="13" fill="#ffd56a" stroke="#735917" stroke-width="3"/><text x="635" y="378" class="pin">5</text>
    <circle cx="680" cy="410" r="13" fill="#ffd56a" stroke="#735917" stroke-width="3"/><text x="635" y="418" class="pin">4</text>
    <circle cx="680" cy="450" r="13" fill="#ddd" stroke="#777" stroke-width="3"/><text x="635" y="458" class="pin">3</text>
    <circle cx="680" cy="490" r="13" fill="#ffd56a" stroke="#735917" stroke-width="3"/><text x="635" y="498" class="pin">2</text>
    <circle cx="680" cy="530" r="13" fill="#ddd" stroke="#777" stroke-width="3"/><text x="635" y="538" class="pin">1</text>
    <circle cx="680" cy="570" r="13" fill="#ddd" stroke="#777" stroke-width="3"/><text x="620" y="578" class="pin">38</text>
    <circle cx="680" cy="610" r="13" fill="#ddd" stroke="#777" stroke-width="3"/><text x="620" y="618" class="pin">39</text>
    <circle cx="680" cy="650" r="13" fill="#ddd" stroke="#777" stroke-width="3"/><text x="620" y="658" class="pin">40</text>
    <circle cx="680" cy="690" r="13" fill="#ddd" stroke="#777" stroke-width="3"/><text x="620" y="698" class="pin">41</text>
    <circle cx="680" cy="730" r="13" fill="#ddd" stroke="#777" stroke-width="3"/><text x="620" y="738" class="pin">42</text>
  </g>

  <!-- Exact leader endpoints -->
  <g fill="none" stroke="#2457a6" stroke-width="4" marker-end="url(#arrow)">
    <path d="M1450 300 H760 L700 290"/>
    <path d="M1450 400 H810 L700 330"/>
    <path d="M1450 500 H840 L700 370"/>
    <path d="M1450 600 H870 L700 410"/>
    <path d="M1450 700 H900 L700 490"/>
  </g>
  <g>
    <rect x="950" y="260" width="500" height="78" rx="12" fill="#f2eaff" stroke="#6d43a5" stroke-width="3"/>
    <text x="980" y="309" class="call">GPIO7 — AUX_BUSY_ASSERT</text>
    <rect x="950" y="360" width="500" height="78" rx="12" fill="#eaf3ff" stroke="#2457a6" stroke-width="3"/>
    <text x="980" y="409" class="call">GPIO6 — AUX_BUSY_IN</text>
    <rect x="950" y="460" width="500" height="78" rx="12" fill="#eaf8ef" stroke="#29834d" stroke-width="3"/>
    <text x="980" y="509" class="call">GPIO5 — AUX_TX</text>
    <rect x="950" y="560" width="500" height="78" rx="12" fill="#eaf3ff" stroke="#2457a6" stroke-width="3"/>
    <text x="980" y="609" class="call">GPIO4 — AUX_RX</text>
    <rect x="950" y="660" width="500" height="78" rx="12" fill="#f2eaff" stroke="#6d43a5" stroke-width="3"/>
    <text x="980" y="709" class="call">GPIO2 — AUX_TX_ENABLE</text>
  </g>

  <rect x="780" y="780" width="720" height="130" rx="16" fill="#f7f8fa" stroke="#687386" stroke-width="3"/>
  <text x="810" y="824" class="body">These are future logic connections only.</text>
  <text x="810" y="860" class="body">They require a protected 5 V interface before use.</text>
  <text x="810" y="896" class="warn">GPIO38–GPIO42 are NOT AUX signals in this design.</text>

  <rect x="80" y="950" width="1440" height="88" rx="14" fill="#fff3f3" stroke="#c52121" stroke-width="3"/>
  <text x="110" y="987" class="warn">CURRENTLY AVAILABLE: multimeter, breadboard, jumper wires.</text>
  <text x="110" y="1024" class="warn">STOP: obtain the buffer, MOSFET, resistors, capacitors, and regulated 5 V source before powered testing.</text>
</svg>
